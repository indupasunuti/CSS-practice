<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        box-sizing: border-box;
    }
    body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #card{
        width: 250px;
        height: 120px;
        border: 2px solid black;
        display: flex;
        border-radius: 10px;
    }
    #card>img{
        border-top-left-radius: 7px;
        border-bottom-left-radius: 7px;
    }

    #content{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-style: oblique;
        gap: 4px;
    }
    #content>button{
        padding: 3px;
        font-size: 10px;
        background-color: rgba(128, 128, 128, 0.465);
        border-radius: 10px;
        border: none;
    }
    @media (max-width:480px){
        #card{
            width: 150px;
            height: 100px;
        }
    }
    @media (min-width:481px) and (max-width:768px){
        #card{
            width: 200px;
            height: 150px;
        }
    }
    @media (min-width:769px) and (max-width:1024px){
        #card{
            width: 250px;
            height: 180px;
        }
    }
    @media (min-width:1025px) {
        #card{
            width: 300px;
            height: 200px;
        }
    }
</style>
<body>
    <section id="card">
        <img src="https://www.hiravshah.com/wp-content/uploads/2022/05/mahesh-babu-.jpg" alt="" width="100px" height="116px">
        <div id="content">
            <p>Super Star💫</p>
            <p>Mahesh Babu</p>
            <button>knowmore</button>
        </div>
    </section>
</body>
</html>
